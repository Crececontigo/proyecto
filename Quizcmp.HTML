<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz-Crece contigo</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

   <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #a1c4fd, #c2e9fb);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            overflow-y: auto;
        }
        h1 {
            text-align: center;
            color: #004d7a;
            margin-bottom: 30px;
            font-size: 3em;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s;
        }
        .question {
            margin-bottom: 20px;
            background: #ffffff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
            animation: slideIn 0.5s;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        .question:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }
        label {
            display: block;
            margin: 15px 0;
            cursor: pointer;
            font-size: 1.2em;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s;
        }
        input[type="radio"] {
            display: none;
        }
        input[type="radio"] + label:hover {
            background: #e0e0e0;
        }
        input[type="radio"]:checked + label {
            background: #007BFF;
            color: white;
        }
        button {
            padding: 12px 25px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2em;
            transition: background-color 0.3s, transform 0.3s;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        button:hover {
            background-color: #0056b3;
            transform: translateY(-2px)
        }
        .correct-button {
            background-color: #28a745
        }
        .incorrect-button {
            background-color: #dc3545
        }
        .result {
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            width: 90%;
            max-width: 600px;
            animation: fadeIn 0.5s forwards;
        }
        .hidden { display: none; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

<h1>Conocete</h1>


<button id="nextButton" onclick="nextQuestion()">Siguiente</button>
<div id="result" class="result hidden"></div>
</a>
<p>
<div id="quiz"></div>
<button type="button" onclick="location.href='Explora-mas.html';" style="padding: 10px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
    Volver a Crece contigo
</button>


</div>
<script>
    const questions = [
        {
            question: "Si cometo un error frente a los demás, yo…",
            answers: [" Me digo cosas feas y me siento inútil.", "Me río de mí mismo, lo intento corregir y sigo adelante.", "Me callo y me alejo de todos."],
            correct: "Me río de mí mismo, lo intento corregir y sigo adelante.",
            explanation: "Poder reírte de un error y continuar demuestra que entiendes que equivocarse no te hace menos. ¡Todos fallamos! Lo importante es aprender y avanzar."
        },
        {
            question: "Cuando me miro al espejo…",
            answers: ["Solo veo defectos.", "Me gusto algunos días, otros no tanto, pero me respeto.", "Evito mirarme porque no me gusta cómo soy."],
            correct: "Me gusto algunos días, otros no tanto, pero me respeto.",
            explanation: "Aceptar que no todos los días te vas a sentir increíble, pero aún así respetarte, es una gran señal de amor propio."
        },
        {
            question: "Si alguien no me quiere o no me acepta…",
            answers: ["Siento que yo tengo algo malo.", "Me duele, pero sé que no todos tienen que aceptarme.", "Trato de cambiar para agradarle."],
            correct: "Me duele, pero sé que no todos tienen que aceptarme.",
            explanation: "No gustarle a todos no significa que valgas menos. Saberlo te ayuda a mantener tu valor personal sin depender de otros."
        },
        {
            question: "Si quiero hacer algo nuevo y me da miedo…",
            answers: ["No lo hago. Seguro fallo.", "Lo intento, aunque sienta nervios.", "Le pido a otro que lo haga por mí."],
            correct: "Lo intento, aunque sienta nervios.",
            explanation: "Intentarlo con miedo es un acto de valentía. Cada paso que das, aunque sea pequeño, te hace crecer."
        },
        {
            question: "Cuando recibo un cumplido…",
            answers: ["No lo creo y me da pena.", "Digo “gracias” y lo acepto con una sonrisa.", "Cambio de tema o hago un chiste."],
            correct: "Digo “gracias” y lo acepto con una sonrisa.",
            explanation: "Aceptar algo bueno sobre ti también es parte del amor propio. ¡Te lo mereces!"
        },
        {
            question: "Cuando alguien me critica de forma negativa…",
            answers: ["Me hundo y pienso que tienen razón.", "Escucho, evalúo si es útil, y sigo con lo mío.", "Me enojo y peleo con esa persona."],
            correct: " Escucho, evalúo si es útil, y sigo con lo mío.",
            explanation: "Escuchar sin destruirte es un acto de madurez. No toda crítica define quién eres."
        },
        {
            question: "¿Qué piensas cuando fallas en algo?",
            answers: ["Soy un fracaso.", "Fue solo una falla. Puedo mejorar.", "Nunca lo haré bien."],
            correct: "Fue solo una falla. Puedo mejorar.",
            explanation: "Tu valor no depende de un error. Fallar es parte del aprendizaje."
        },
        {
            question: "¿Qué haces cuando necesitas ayuda?",
            answers: ["Me lo guardo. No quiero molestar.", "Pido ayuda con respeto y sin vergüenza.", "Espero a que alguien se dé cuenta solo."],
            correct: "Pido ayuda con respeto y sin vergüenza.",
            explanation: "Pedir ayuda no es debilidad, es inteligencia emocional."
        },
        {
            question: "¿Cómo reaccionas cuando alguien tiene más éxito que tú?",
            answers: ["Me comparo y me siento mal.", "Me alegro por esa persona y sigo trabajando en lo mío. ", "Me molesto y dejo de intentarlo."],
            correct: "Me alegro por esa persona y sigo trabajando en lo mío. ",
            explanation: "Alegrarte por otros sin compararte es una señal de seguridad y madurez."
        },
        {
            question: "¿Te hablas con cariño cuando estás mal?",
            answers: ["No, me trato mal o me ignoro.", "Sí, intento consolarme como lo haría con un amigo.", "Me distraigo y evito pensar."],
            correct: "Sí, intento consolarme como lo haría con un amigo.",
            explanation: "Tu voz interior también puede abrazarte. Trátate con la misma compasión que a los demás."
        },
        {
            question: "¿Celebras tus pequeños logros?",
            answers: [" No, solo me fijo en lo que me falta.", "Sí, reconozco que todo paso cuenta.", "Me da pena felicitarme por cosas pequeñas."],
            correct: "Sí, reconozco que todo paso cuenta.",
            explanation: "Cada avance, por pequeño que sea, es parte de tu crecimiento. ¡Vale la pena celebrarlo!"
        },
        {
            question: "¿Cómo te sientes contigo mismo la mayor parte del tiempo?",
            answers: ["Insatisfecho y confundido.", "Acepto que tengo cosas buenas y otras que quiero mejorar. ", "Me cuesta encontrar algo bueno en mí."],
            correct: "Acepto que tengo cosas buenas y otras que quiero mejorar. ",
            explanation: "La autoaceptación es el punto de partida. No se trata de ser perfecto, sino auténtico.."
        }
    ];

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    let currentQuestion = 0;
    let score = 0;
    const totalQuestions = 5; 
    const selectedQuestions = shuffle(questions).slice(0, totalQuestions);

    function loadQuestion() {
        const quizDiv = document.getElementById('quiz');
        const question = selectedQuestions[currentQuestion];

        if (question) {
            quizDiv.innerHTML = `
                <div class="question animated">
                    <p>${currentQuestion + 1}. ${question.question}</p>
                    ${question.answers.map((answer) => `
                        <input type="radio" id="q${currentQuestion}-${answer}" name="q${currentQuestion}" value="${answer}">
                        <label for="q${currentQuestion}-${answer}">${answer}</label>
                    `).join('')}
                </div>
            `;
            quizDiv.firstChild.classList.add('animated');
            quizDiv.firstChild.style.animation = "slideIn 0.5s";
        } else {
            showResult();
        }
    }

    function nextQuestion() {
        const question = selectedQuestions[currentQuestion];
        const selectedAnswer = document.querySelector(`input[name="q${currentQuestion}"]:checked`);
        const nextButton = document.getElementById('nextButton');

        if (selectedAnswer) {
          
            nextButton.classList.remove('correct-button', 'incorrect-button');

           
            if (selectedAnswer.value === question.correct) {
                score++;
                nextButton.classList.add('correct-button')
            } else {
                nextButton.classList.add('incorrect-button')
            }

            currentQuestion++;
            setTimeout(() => {
                loadQuestion();
                
                nextButton.classList.remove('correct-button', 'incorrect-button');
            }, 1000)
        } else {
            alert("Por favor, selecciona una respuesta.");
        }
    }

    function showResult() {
        document.getElementById('quiz').classList.add('hidden');
        document.getElementById('nextButton').classList.add('hidden');
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `Has acertado ${score} de ${totalQuestions} preguntas.<br><br>`;
        selectedQuestions.forEach((question) => {
            resultDiv.innerHTML += `<strong>${question.question}</strong><br>
                                    Respuesta correcta: ${question.correct}<br>
                                    Justificación: ${question.explanation}<br><br>`;
        });
        resultDiv.classList.remove('hidden');
        resultDiv.style.opacity = 1; 
        resultDiv.style.transition = "opacity 0.5s ease-in-out";
        resultDiv.style.animation = "fadeIn 0.5s forwards";
    }

    loadQuestion();
    
</script>

</body>
</html>
